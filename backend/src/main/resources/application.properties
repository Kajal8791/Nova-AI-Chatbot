server.port=8080
spring.application.name=nova-ai-chatbot

# Groq API Configuration
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=openai/gpt-oss-20b


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/nova_ai_db
spring.datasource.username=nova_user
spring.datasource.password=${NOVA_DB_PASSWORD}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
