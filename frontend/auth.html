
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #10172a, #263b70);
            padding: 20px;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 18px;
            background: #17233b;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #75a7ff;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #b8c5dd;
            margin-bottom: 28px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .tabs button {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #293956;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .tabs button.active {
            background: #3979ee;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #dce6f8;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #405273;
            border-radius: 8px;
            background: #101a2e;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #75a7ff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #3979ee;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #2866d6;
        }

        .message {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #a9c8ff;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">✦ Nova AI</div>
    <p class="subtitle">Your Intelligent AI Assistant</p>

    <div class="tabs">
        <button id="loginTab" class="active" type="button"
            onclick="showLogin()">Login</button>

        <button id="signupTab" type="button"
            onclick="showSignup()">Sign Up</button>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail"
                placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword"
                placeholder="Enter your password" required>
        </div>

        <button class="submit-btn" type="submit">Login</button>
    </form>

    <form id="signupForm" class="hidden">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signupName"
                placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="signupEmail"
                placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Password (Minimum 8 characters)</label>
            <input type="password" id="signupPassword"
                placeholder="Create a password"
                minlength="8" required>
        </div>

        <button class="submit-btn" type="submit">
            Create Account
        </button>
    </form>

    <p class="message" id="message"></p>

</div>

<script>
    function showLogin() {
        document.getElementById("loginForm").classList.remove("hidden");
        document.getElementById("signupForm").classList.add("hidden");

        document.getElementById("loginTab").classList.add("active");
        document.getElementById("signupTab").classList.remove("active");

        document.getElementById("message").textContent = "";
    }

    function showSignup() {
        document.getElementById("signupForm").classList.remove("hidden");
        document.getElementById("loginForm").classList.add("hidden");

        document.getElementById("signupTab").classList.add("active");
        document.getElementById("loginTab").classList.remove("active");

        document.getElementById("message").textContent = "";
    }


const API_URL = "http://localhost:8080/api/auth";

// SIGNUP API
document.getElementById("signupForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("signupName").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    const message = document.getElementById("message");
    message.textContent = "Creating your account...";

    try {
        const response = await fetch(API_URL + "/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || data.error || "Signup failed");
        }

        message.textContent = "Account created successfully! Please login.";

        document.getElementById("signupForm").reset();

        showLogin();

    } catch (error) {
        message.textContent = error.message;
    }
});


// LOGIN API
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value;
    const password = document.getElementById("loginPassword").value;

    const message = document.getElementById("message");
    message.textContent = "Logging in...";

    try {
        const response = await fetch(API_URL + "/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || data.error || "Login failed");
        }

        // Save login information
        localStorage.setItem("novaAI_token", data.token);
        localStorage.setItem("novaAI_user", JSON.stringify({
            userId: data.userId,
            name: data.name,
            email: data.email
        }));

        message.textContent = "Login successful! Opening Nova AI...";

        // Open Nova AI Chat
        window.location.href = "index.html";

    } catch (error) {
        message.textContent = error.message;
    }
});

</script>

</body>
</html>
